name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The workspace is built against FFmpeg 7.1 and LLVM 19 (newer LLVM generates empty
    # structs for the FFmpeg bindings). Debian trixie packages both, so the job runs in its
    # image instead of building FFmpeg by hand.
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config python3 python3-venv \
            clang-19 libclang-19-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libasound2-dev
      - uses: actions/checkout@v5
      - name: Check the status picture and the README's numbers
        # `scripts/status.py --check` fails when docs/status.svg or the README's Status section
        # no longer match Menu-Status.md and ROADMAP.md: run `python3 scripts/status.py` when
        # either of those changes.
        run: python3 scripts/status.py --check
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Clippy on changed crates
        run: |
          # Only enforce clippy on the crates touched by this change. The workspace has
          # pre-existing lint and formatting warnings in untouched code.
          cargo clippy -p picasso-decode -p picasso-core -p picasso-ui 2>&1
      - name: Build and test
        env:
          LIBCLANG_PATH: /usr/lib/llvm-19/lib
        run: cargo test --workspace
      - name: Other programs read the AAF and XML this one writes
        # pyaaf2 (the AAF library OpenTimelineIO's adapter uses) follows every clip of the test
        # timeline's AAF to its file, and Python's XML parser checks the XML the way Final Cut
        # Pro 7 and Premiere read it (scripts/check_interchange.py).
        env:
          LIBCLANG_PATH: /usr/lib/llvm-19/lib
        run: |
          python3 -m venv /tmp/readers
          /tmp/readers/bin/pip install --quiet pyaaf2==1.7.1
          PICASSO_AAF_SAMPLE=/tmp/timeline.aaf cargo test -q -p picasso-aaf sample_for_other_readers
          PICASSO_XML_SAMPLE=/tmp/timeline.xml cargo test -q -p picasso-core sample_for_other_readers
          /tmp/readers/bin/python scripts/check_interchange.py aaf /tmp/timeline.aaf
          python3 scripts/check_interchange.py xml /tmp/timeline.xml
