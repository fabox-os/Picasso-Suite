[package]
name = "picasso-ui"
description = "The Picasso Suite interface: pages, timeline, viewer, colour wheels and scopes (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
picasso-core.workspace = true
picasso-audio.workspace = true
picasso-color.workspace = true
picasso-render.workspace = true
# Pure Rust, so the browser build writes AAF files too.
picasso-aaf.workspace = true
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }  # MIT OR Apache-2.0
# File dialogs: native on Windows and macOS, the desktop portal on Linux (no GTK needed), and the
# browser's file picker and downloads on the web.
rfd = "0.17"  # MIT

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
picasso-decode.workspace = true
picasso-export.workspace = true
picasso-media.workspace = true
picasso-drp.workspace = true
tracing.workspace = true
# The session log (Help > Export Log File): the program's warnings and errors, and those of
# eframe and wgpu (through `log`), written to a text file.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "tracing-log"] }  # MIT
pollster = "0.4"  # MIT OR Apache-2.0
# Help > Check for Updates reads GitHub's answer about the latest release.
serde_json.workspace = true
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"  # MIT OR Apache-2.0

[lints]
workspace = true
